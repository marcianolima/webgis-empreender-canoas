name: Pesquisar perfil público Observatório Sebrae Canoas
on:
  push:
    paths: [.github/workflows/probe-sebrae.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar HTML e metadados HTTP do portal público
        run: |
          python - <<'PY'
          import urllib.request,re
          u="https://observatorio.sebrae.com.br/profile/geo/canoas"
          for ua in ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36","Googlebot"):
            try:
              req=urllib.request.Request(u,headers={"User-Agent":ua,"Accept":"text/html"})
              with urllib.request.urlopen(req,timeout=30) as f:
                b=f.read(2_000_000).decode("utf-8","replace")
                print("HTTP",f.status,"UA",ua[:20],"LEN",len(b),"URL",f.url,"TITLE",re.findall(r'<title[^>]*>(.*?)</title',b,re.I|re.S)[:2],"SCRIPTS",re.findall(r'<script[^>]+src="([^"]+)',b)[:12],flush=True)
                print("PHRASES",[(x,b.find(x)) for x in ["Iniciando sessão","__NEXT_DATA__","Número de empregados","Empresas Ativas","Canoas","RAIS","__NUXT__"]],flush=True)
                print("FIRST",b[:1200],flush=True)
            except Exception as e:print("HTTP_ERROR",repr(e),flush=True)
          PY
      - name: Inventariar indicadores municipais públicos contidos no HTML
        run: |
          python - <<'PY'
          import urllib.request,re,json,collections
          url="https://observatorio.sebrae.com.br/profile/geo/canoas"
          html=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=45).read().decode("utf-8","replace")
          data=json.loads(re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',html,re.S).group(1))
          p=data["props"]["pageProps"]
          record=p["initialState"]["records"]
          print("RECORD_KEYS",list(record),flush=True)
          print("ENTITY_KEYS",[(k,len(v)) for k,v in record.get("entities",{}).items()],flush=True)
          vars=p["initialState"]["variables"]["variables"]
          print("VARIABLE_COUNT",len(vars),"IDS",list(vars)[-10:],flush=True)
          for id,v in vars.items():
            keep=[(k,w) for k,w in v.items() if isinstance(w,(int,float,bool)) and not isinstance(w,bool)]
            data=[(k,w) for k,w in v.items() if isinstance(w,list) and len(w)>0 and isinstance(w[0],dict)]
            snippets=[(k,w[:130]) for k,w in v.items() if isinstance(w,str) and re.search(r"emprego|empresa|pib|renda|município|canoas|agro|sebrae|sal[áa]r|ocupa|2025",k,re.I)]
            if keep or data or snippets:
              print("V",id,"SCALARS",keep[:14],"DATA",[(k,len(w),w[:2]) for k,w in data[:4]],"STRING",snippets[:3],flush=True)
          PY
