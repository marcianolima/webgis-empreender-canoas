name: Probe official CNPJ distribution
on:
  push:
    paths:
      - .github/workflows/probe-cnpj.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify RFB download transport without retrieving large files
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,base64
          base="https://arquivos.receitafederal.gov.br"
          candidates=[
            "https://dadosabertos.rfb.gov.br/CNPJ/dados_abertos_cnpj/2026-09/Municipios.zip",
            base+"/index.php/s/YggdBLfdninEJX9/download?path=%2F2026-09&files=Municipios.zip",
            base+"/index.php/s/YggdBLfdninEJX9/download?path=%2F2026-09%2F&files=Municipios.zip",
            base+"/public.php/dav/files/YggdBLfdninEJX9/2026-09/Municipios.zip",
            base+"/public.php/webdav/2026-09/Municipios.zip",
            base+"/index.php/s/YggdBLfdninEJX9/download?path=%2F2026-09&files=Estabelecimentos0.zip",
          ]
          for url in candidates:
            for method in ("HEAD",):
              try:
                headers={"User-Agent":"Mozilla/5.0","Accept-Encoding":"identity"}
                if "public.php/dav/" in url:
                    headers["Authorization"]="Basic "+base64.b64encode(b"YggdBLfdninEJX9:").decode()
                req=urllib.request.Request(url,headers=headers,method=method)
                with urllib.request.urlopen(req,timeout=12) as r:
                  print(method,r.status,r.geturl(),r.headers.get("content-length"),r.headers.get("Content-Type"),flush=True)
              except Exception as e:print(method,"FAIL",url,type(e).__name__,str(e)[:180],flush=True)
          PY
