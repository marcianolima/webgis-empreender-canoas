name: FIRJAN | Diagnóstico IFGF 2025
on:
  push:
    branches: [feat/firjan-ifdm-historico-20261019]
    paths: [.github/workflows/probe-ifgf.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extrair esquema e observações de Canoas do IFGF 2013 a 2024
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io,xml.etree.ElementTree as ET
          src="https://firjan.com.br/data/files/86/20/2F/AC/1345991031B91689D8284EA8/Evolucao_por_Indicador_2013_a_2024_IFGF_2025.xlsx"
          req=urllib.request.Request(src,headers={"User-Agent":"Mozilla/5.0","Accept":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*"})
          with urllib.request.urlopen(req,timeout=40) as r:data=r.read(11_000_000)
          print("IFGF_BYTES",len(data),"SIGNATURE",data[:4],flush=True)
          assert data.startswith(b"PK\x03\x04")
          z=zipfile.ZipFile(io.BytesIO(data))
          ns="{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"
          strings=[]
          if "xl/sharedStrings.xml" in z.namelist():
            root=ET.fromstring(z.read("xl/sharedStrings.xml"))
            strings=["".join(t.text or "" for t in si.iter(ns+"t")) for si in root.iter(ns+"si")]
          print("IFGF_SHARED",len(strings),flush=True)
          sheets=[n for n in z.namelist() if n.startswith("xl/worksheets/sheet") and n.endswith(".xml")]
          print("IFGF_SHEETS",sheets,flush=True)
          for path in sheets:
            hits=0;rows=0;first=0
            for _,el in ET.iterparse(io.BytesIO(z.read(path)),events=("end",)):
              if el.tag!=ns+"row":continue
              cells={}
              for c in el.findall(ns+"c"):
                ref=c.get("r");val=c.find(ns+"v")
                if val is not None and val.text is not None:
                  v=strings[int(val.text)] if c.get("t")=="s" else val.text
                elif c.get("t")=="inlineStr":v="".join(t.text or "" for t in c.iter(ns+"t"))
                else:v=""
                if v!="":cells[ref]=v
              rows+=1
              if first<5:print("IFGF_FIRST",path,rows,str(cells)[:1800],flush=True);first+=1
              if any("canoas" in str(v).lower() for v in cells.values()) or any(str(v).strip() in ("430460","4304606") for v in cells.values()):
                print("IFGF_CANOAS",path,rows,str(cells)[:4200],flush=True);hits+=1
              el.clear()
            print("IFGF_ROWS",path,rows,"MATCHES",hits,flush=True)
          PY