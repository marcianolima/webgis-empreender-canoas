name: GEO Canoas | Homologação browser e mobile
on:
  workflow_run:
    workflows: ["Canoas Empreende | Dados oficiais e GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador de teste
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
      - name: Auditar mapa real, PMTiles, filtros e responsividade
        run: |
          python - <<'PY'
          import asyncio,io,json,urllib.request
          from PIL import Image
          from playwright.async_api import async_playwright
          ROOT="https://marcianolima.github.io/webgis-empreender-canoas/"
          async def main():
            with urllib.request.urlopen(ROOT+"data/bairros-economia.pmtiles",timeout=20) as r:
              magic=r.read(8);print("PMTILES_HTTP",r.status,r.headers.get("Content-Length"),magic,flush=True)
              assert magic==bytes([80,77,84,105,108,101,115,3])
            with urllib.request.urlopen(ROOT+"data/bairros-economia.json",timeout=20) as r:
              d=json.load(r)
            assert d["status"]=="verified" and len(d["neighborhoods"])==18
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              for label,w,h in [("desktop",1366,900),("mobile",390,844)]:
                home=await browser.new_page(viewport={"width":w,"height":h},device_scale_factor=1)
                home_errors=[]
                home.on("pageerror",lambda err:home_errors.append(str(err)))
                home_response=await home.goto(ROOT,wait_until="domcontentloaded",timeout=60000)
                assert home_response and home_response.status==200
                header=home.get_by_label("Cabeçalho do observatório")
                await header.wait_for()
                height=await header.evaluate("(el)=>el.getBoundingClientRect().height")
                assert 50<=height<=64,("HEADER_HEIGHT",height)
                await home.get_by_text("18 bairros oficiais · GeoCanoas / PMTiles").wait_for(timeout=50000)
                assert await home.get_by_text("Limite municipal oficial · IBGE").count()==0
                if label=="desktop":
                  sidebar=home.get_by_label("Barra lateral")
                  assert await sidebar.is_visible()
                  group=sidebar.get_by_role("button",name="Território e mapas")
                  assert await group.get_attribute("aria-expanded")=="true"
                  await group.click()
                  assert await group.get_attribute("aria-expanded")=="false"
                  await group.click()
                  assert await sidebar.get_by_role("link",name="Mapa econômico").count()==1
                else:
                  assert not await home.get_by_label("Barra lateral").is_visible()
                  await home.get_by_role("button",name="Abrir menu principal").click()
                  drawer=home.get_by_role("dialog",name="Navegação do observatório")
                  assert await drawer.is_visible()
                  group=drawer.get_by_role("button",name="Território e mapas")
                  assert await group.get_attribute("aria-expanded")=="true"
                  await group.click()
                  assert await group.get_attribute("aria-expanded")=="false"
                  await group.click()
                  assert await group.get_attribute("aria-expanded")=="true"
                  await drawer.get_by_role("button",name="Fechar menu principal").click()
                  await drawer.wait_for(state="detached",timeout=4000)
                await home.evaluate("window.scrollTo(0,document.documentElement.scrollHeight)")
                await home.wait_for_timeout(300)
                top=await header.evaluate("(el)=>el.getBoundingClientRect().top")
                assert abs(top)<=2,("STICKY_HEADER_SCROLL",top)
                assert not home_errors,home_errors
                print("GLOBAL_NAV_AND_GEOCANOAS_HOME_OK",label,flush=True)
                await home.screenshot(path=f"header-{label}.png",full_page=False)
                await home.close()
                page=await browser.new_page(viewport={"width":w,"height":h},device_scale_factor=1)
                errors=[]
                page.on("pageerror",lambda err:errors.append(str(err)))
                response=await page.goto(ROOT+"bairros/",wait_until="domcontentloaded",timeout=60000)
                assert response and response.status==200
                await page.locator(".maplibregl-canvas").wait_for(timeout=45000)
                await page.wait_for_timeout(6000)
                content=await page.locator("body").inner_text()
                assert "59.553" in content or "59,553" in content or "59 553" in content
                assert "PMTiles indisponível" not in content,content[-3000:]
                assert "Carregando PMTiles" not in content,content[-3000:]
                assert not errors,errors
                canvas=page.locator(".maplibregl-canvas")
                img=Image.open(io.BytesIO(await canvas.screenshot())).convert("RGB")
                green=sum(1 for r,g,b in img.getdata() if g>r+8 and g>b+4 and 35<r<215)
                print("MAP_CHECK",label,"canvas",img.size,"green_pixels",green,"url",page.url,flush=True)
                assert green>300,"Map rendered with no geographic thematic colors"
                if label=="mobile":
                  horizontal=await page.evaluate("({scroll:document.documentElement.scrollWidth,window:window.innerWidth})")
                  print("MOBILE_OVERFLOW",horizontal,flush=True)
                  assert horizontal["scroll"]<=horizontal["window"]+12
                await page.get_by_label("Seção CNAE").select_option("G")
                await page.get_by_label("Indicador").select_option("density")
                await page.wait_for_timeout(1000)
                body=await page.locator("body").inner_text()
                assert "Estabelecimentos por km²" in body
                await page.screenshot(path=f"geo-{label}.png",full_page=True)
                await page.close()
                hp=await browser.new_page(viewport={"width":w,"height":h},device_scale_factor=1)
                h_errors=[]
                hp.on("pageerror",lambda err:h_errors.append(str(err)))
                response=await hp.goto(ROOT+"hex500/",wait_until="domcontentloaded",timeout=60000)
                assert response and response.status==200
                await hp.locator(".maplibregl-canvas").wait_for(timeout=45000)
                await hp.wait_for_timeout(6500)
                body=await hp.locator("body").inner_text()
                assert "17.851" in body or "17,851" in body
                assert "Erro ao carregar o mapa" not in body,body[-2200:]
                assert "Carregando camada de hexágonos" not in body
                assert not h_errors,h_errors
                h_img=Image.open(io.BytesIO(await hp.locator(".maplibregl-canvas").screenshot())).convert("RGB")
                h_green=sum(1 for r,g,b in h_img.getdata() if g>r+8 and g>b+4 and 35<r<215)
                print("HEX_CHECK",label,"canvas",h_img.size,"green_pixels",h_green,flush=True)
                assert h_green>350,"No thematic hexagons rendered"
                await hp.get_by_role("button",name="Calor").click()
                await hp.wait_for_timeout(850)
                content=await hp.locator("body").inner_text()
                assert "superfície suavizada" in content
                assert not h_errors,h_errors
                await hp.get_by_label("Variável").select_option("cnpj")
                await hp.wait_for_timeout(900)
                content=await hp.locator("body").inner_text()
                assert "13.154" in content,content[-2400:]
                assert "Cruzamento CNPJ × CNEFE" in content
                await hp.get_by_label("Seção CNAE do CNPJ coincidente").select_option("G")
                await hp.wait_for_timeout(600)
                assert "CNAE seção G" in (await hp.locator("body").inner_text())
                assert not h_errors,h_errors
                print("CNPJ_HEAT_FILTER_OK",label,"matched",13154,"CNAE_G",flush=True)
                assert "Onde se concentram os CNPJs com endereço conciliado?" in (await hp.locator("body").inner_text())
                assert "Há 1 fotografia geográfica homologada" in (await hp.locator("body").inner_text())
                hotspot=hp.get_by_label("Mostrar perímetros dos núcleos")
                assert await hotspot.count()==1
                await hotspot.check()
                await hp.wait_for_timeout(1100)
                assert await hotspot.is_checked()
                assert await hp.get_by_text("5 agrupamentos identificados",exact=False).count()>0
                print("HOTSPOT_500M_UI_OK",label,"five contiguous regions",flush=True)
                with urllib.request.urlopen(ROOT+"data/cnefe-hex500.json",timeout=20) as rr:
                  published=json.load(rr)
                assert published["spatialOverlayVersion"]==1
                assert "hex_bairros" in published["pmtiles"]["layers"]
                assert published["spatialTopology"]["fullyContainedHexagons"]>0
                await hp.get_by_label("Bairro oficial · seleção espacial").select_option("Centro")
                await hp.wait_for_timeout(1300)
                scoped=await hp.locator("body").inner_text()
                assert "Diagnóstico geométrico · Centro" in scoped
                assert "Partes de divisa aparecem em bege" in scoped
                assert "Ranking exclusivo dos hexágonos" in scoped
                assert not h_errors,h_errors
                print("TOPOLOGICAL_INTERSECTION_BROWSER_OK",label,flush=True)
                if label=="mobile":
                  m=await hp.evaluate("({scroll:document.documentElement.scrollWidth,window:window.innerWidth})")
                  print("HEX_MOBILE_OVERFLOW",m,flush=True)
                  assert m["scroll"]<=m["window"]+12
                await hp.screenshot(path=f"hex500-{label}.png",full_page=True)
                await hp.close()
              await browser.close()
          asyncio.run(main())
          PY
      - name: Anexar screenshots da homologação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocanoas-map-desktop-mobile
          path: |
            geo-desktop.png
            geo-mobile.png
            hex500-desktop.png
            hex500-mobile.png
            header-desktop.png
            header-mobile.png
          if-no-files-found: ignore
          retention-days: 7
