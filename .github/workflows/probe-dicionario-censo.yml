name: Censo 2022 | Inspecionar dicionários oficiais
on:
  push:
    branches: [feat/censo2022-setores-pmtiles-20261020]
    paths: [.github/workflows/probe-dicionario-censo.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q openpyxl
      - name: Dicionário IBGE e rendimento do responsável (revisão 2026)
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io,openpyxl
          urls={
            "dictionary":"https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/dicionario_de_dados_agregados_por_setores_censitarios_20260520.xlsx",
            "incomeDictionary":"https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios_Rendimento_do_Responsavel/dicionario_de_dados_renda_responsavel_20260508.xlsx",
            "income":"https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios_Rendimento_do_Responsavel/Agregados_por_setores_renda_responsavel_BR_20260508_csv.zip",
          }
          for key,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=110) as r: b=r.read(19000000)
              print("FILE",key,"size",len(b),flush=True)
              if key=="income":
                z=zipfile.ZipFile(io.BytesIO(b))
                print("MEMBERS",[(f.filename,f.file_size) for f in z.infolist()],flush=True)
                for f in z.infolist():
                  if f.filename.endswith(".csv"):
                    with z.open(f) as stream:
                      for i in range(2):print("INCOME_CSV",stream.readline().decode("latin1")[:1600],flush=True)
              else:
                wb=openpyxl.load_workbook(io.BytesIO(b),read_only=True,data_only=True)
                for sh in wb:
                  print("SHEET",key,sh.title,sh.max_row,sh.max_column,flush=True)
                  for i,row in enumerate(sh.values):
                    vals=[str(v or "")[:140] for v in list(row)[:9]]
                    if i<14 or (any("v0001" in v.lower() or "v01006" in v.lower() or "rendimento" in v.lower() for v in vals) and i<120):
                      print("DICT_ROW",key,sh.title,i+1,vals,flush=True)
                    if i>165:break
            except Exception as ex:print("ERROR",key,type(ex).__name__,str(ex)[:300],flush=True)
          PY