name: Probe full Sebrae public cubes and active-worker filters
on:
  push:
    paths:
      - scripts/probe_sebrae_cubes.py
      - .github/workflows/probe-sebrae-cubes.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/probe_sebrae_cubes.py
