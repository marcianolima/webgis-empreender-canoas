name: FIRJAN | Diagnóstico de planilha oficial
on:
  push:
    branches:
      - feat/firjan-ifdm-historico-20261019
    paths:
      - .github/workflows/probe-ifdm.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Obter e examinar fonte oficial Firjan 2025 sem armazenar planilha
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io,xml.etree.ElementTree as ET
          src="https://www.firjan.com.br/data/files/09/42/7A/34/0EFA6910734FAA69D8284EA8/Serie-Historica-IFDM-2013-a-2023.xlsx"
          req=urllib.request.Request(src,headers={"User-Agent":"Mozilla/5.0 (compatible; open-data ETL)","Accept":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*"})
          b=urllib.request.urlopen(req,timeout=55).read(14000000)
          print("FIRJAN_ARCHIVE_BYTES",len(b),"ZIP_SIGNATURE",b[:4],flush=True)
          assert b[:4]==b"PK\x03\x04" and len(b)>10000
          z=zipfile.ZipFile(io.BytesIO(b))
          ns="{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"
          strings=[]
          if "xl/sharedStrings.xml" in z.namelist():
            root=ET.fromstring(z.read("xl/sharedStrings.xml"))
            strings=["".join(t.text or "" for t in si.iter(ns+"t")) for si in root.iter(ns+"si")]
          print("SHARED_STRINGS",len(strings),flush=True)
          sheets=[n for n in z.namelist() if n.startswith("xl/worksheets/sheet") and n.endswith(".xml")]
          print("SHEETS",sheets,flush=True)
          for path in sheets:
            print("SHEET",path,flush=True)
            first=0;hits=0;rows=0
            for _,el in ET.iterparse(io.BytesIO(z.read(path)),events=("end",)):
              if el.tag!=ns+"row":continue
              cells={}
              for c in el.findall(ns+"c"):
                val=c.find(ns+"v")
                typ=c.attrib.get("t","")
                if val is not None and val.text is not None:
                  v=strings[int(val.text)] if typ=="s" else val.text
                elif typ=="inlineStr":
                  v="".join(t.text or "" for t in c.iter(ns+"t"))
                else:v=""
                if v!="":cells[c.attrib.get("r")]=v
              values=list(cells.values())
              rows+=1
              if first<9:
                print("FIRST",rows,str(cells)[:1300],flush=True);first+=1
              if any("canoas" in str(v).lower() for v in values) or any(str(v).strip()=="4304606" for v in values):
                print("CANOAS_ROW",rows,str(cells)[:1800],flush=True);hits+=1
              el.clear()
            print("SHEET_ROWS",path,rows,"CANOAS",hits,flush=True)
          PY