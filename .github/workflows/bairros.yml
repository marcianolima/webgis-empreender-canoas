name: GEO Canoas | Bairros oficiais e PMTiles
on:
  push:
    branches: [main]
    paths:
      - scripts/collect_bairros.py
      - scripts/collect_hex500.py
      - tests/test_cnpj_geocoding.py
      - tests/test_cartographic_integrity.py
      - .github/workflows/bairros.yml
      - public/data/cnpj.json
      - public/data/cnpj-geo-hex500.json
  pull_request:
    paths:
      - scripts/collect_hex500.py
      - scripts/collect_bairros.py
      - tests/test_cartographic_integrity.py
      - .github/workflows/bairros.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - "CNPJ Receita Federal | Carga integral e atualização"
    types: [completed]
  schedule:
    - cron: "17 13 14 * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: canoas-bairros-pmtiles-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tiles:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas de transformação cartográfica
        run: |
          python -m pip install --quiet "shapely>=2,<3" "pyproj>=3.6,<4"
          if ! command -v tippecanoe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq make g++ libsqlite3-dev zlib1g-dev liblzma-dev
            git clone --quiet --depth 1 https://github.com/felt/tippecanoe.git /tmp/canoas-tippecanoe
            make -C /tmp/canoas-tippecanoe -j2 >/tmp/tippecanoe-make.log 2>&1 || { tail -80 /tmp/tippecanoe-make.log; exit 1; }
            sudo make -C /tmp/canoas-tippecanoe install >/dev/null
          fi
          tippecanoe --version
      - name: Testes de bairros, geometrias e hexágonos
        run: python -m unittest discover -s tests -p 'test_bairros.py' -v
      - name: Auditoria cartográfica de supressão e consistência dos dados atuais
        run: python -m unittest discover -s tests -p 'test_cartographic_integrity.py' -v
      - name: Testar cruzamento exato e limiares de privacidade CNPJ
        run: python -m unittest discover -s tests -p 'test_cnpj_geocoding.py' -v
      - name: Coletar bairros oficiais com fallback no último snapshot validado
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/geocanoas-prior
          cp public/data/bairros-economia.pmtiles public/data/bairros-oficiais.geojson public/data/bairros-economia.json public/data/bairros-economia-series.json /tmp/geocanoas-prior/
          if timeout 150s python scripts/collect_bairros.py; then
            echo "GeoCanoas oficial atualizado e validado"
          else
            echo "::warning::GeoCanoas FeatureServer indisponível: snapshot geométrico anterior recuperado"
            cp /tmp/geocanoas-prior/* public/data/
            python - <<'PY'
          import json
          from pathlib import Path
          d=Path("public/data")
          x=json.loads((d/"bairros-economia.json").read_text())
          source=json.loads((d/"bairros-oficiais.geojson").read_text())
          cnpj=json.loads((d/"cnpj.json").read_text())
          assert x["status"]=="verified" and x["territory"]=="4304606"
          assert x["reference"]==cnpj["reference"], "Existing bairros snapshot is stale relative to CNPJ"
          assert len(source["features"])==len(x["neighborhoods"])==18
          print("GEOCANOAS_SNAPSHOT_FALLBACK",x["reference"],flush=True)
          PY
          fi
      - name: Gerar hexágonos 500m e calor de endereços não domiciliares CNEFE/IBGE
        run: python scripts/collect_hex500.py
      - name: Validar domínio, dados originais, formatos e arquivo de mapa
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          base=Path("public/data")
          x=json.loads((base/"bairros-economia.json").read_text())
          y=json.loads((base/"bairros-economia-series.json").read_text())
          cnpj=json.loads((base/"cnpj.json").read_text())
          hexdata=json.loads((base/"cnefe-hex500.json").read_text())
          hexfile=base/"cnefe-hex500.pmtiles"
          assert hexdata["schemaVersion"]==1 and hexdata["status"]=="verified"
          assert hexdata["territory"]=="4304606" and hexdata["cellWidthMeters"]==500
          assert hexdata["coverage"]["gridCells"]>=300
          assert hexdata["coverage"]["nonResidentialWithCoordinatesInOfficialBairros"]>=2000
          assert hexdata["privacy"]["individualCoordinatesPublished"] is False
          assert hexdata["coverage"]["heatCellsAtLeastFiveHighQualityAddresses"]>=250
          assert "hotspots500" in hexdata["pmtiles"]["layers"]
          assert "hex_bairros" in hexdata["pmtiles"]["layers"]
          assert hexdata["spatialOverlayVersion"]==1
          topo=hexdata["spatialTopology"]
          assert len(topo["neighborhoods"])==18
          assert len(topo["fullCellBairro"])==topo["fullyContainedHexagons"]
          assert topo["fullyContainedHexagons"]+topo["crossBorderHexagons"]==hexdata["coverage"]["gridCells"]
          assert topo["fragments"]>=hexdata["coverage"]["gridCells"]
          assert set(topo["fullCellBairro"]).issubset({row["cell"] for row in hexdata["cells"]})
          observed=sum(row["observedAddresses"] or 0 for row in topo["neighborhoods"])
          suppressed=sum(row["observedAddresses"] is None for row in topo["neighborhoods"])
          located=hexdata["coverage"]["nonResidentialWithCoordinatesInOfficialBairros"]-topo["unassignedCnefePointBoundary"]-topo["ambiguousCnefePointBoundary"]
          assert observed<=located and located-observed<=suppressed*4
          assert all(row["cnpjCellsPublished"]<=row["fullCells"] for row in topo["neighborhoods"])
          assert all(row["partialAreaKm2"]>=0 and row["fullCellAreaKm2"]>=0 for row in topo["neighborhoods"])
          hotspots=hexdata.get("economicHotspots",[])
          assert len({h["id"] for h in hotspots})==len(hotspots)
          assert all(h["matched"]>=60 and h["hexagons"]>=3 for h in hotspots)
          assert all(h["rank"]==i+1 for i,h in enumerate(hotspots))
          assert sum(h["matched"] for h in hotspots)<=hexdata.get("cnpjMatch",{}).get("matchedInPublishedCells",float("inf"))
          if hexdata.get("cnpjMatch"):
            geocoded=json.loads((base/"cnpj-geo-hex500.json").read_text())
            assert geocoded["reference"]==cnpj["reference"]
            assert hexdata["cnpjMatch"]["matched"]==geocoded["coverage"]["matched"]
            assert geocoded["privacy"]["individualCoordinatesPublished"] is False
            assert geocoded["privacy"]["individualAddressesPublished"] is False
          assert hexfile.read_bytes()[:8]==b"PMTiles\x03"
          assert hashlib.sha256(hexfile.read_bytes()).hexdigest()==hexdata["pmtiles"]["sha256"]
          assert x["schemaVersion"]==1 and x["status"]=="verified"
          assert x["territory"]=="4304606" and x["reference"]==cnpj["reference"]
          geo=json.loads((base/"bairros-oficiais.geojson").read_text())
          assert len(geo["features"])==18
          assert {int(f["id"]) for f in geo["features"]}=={r["id"] for r in x["neighborhoods"]}
          assert len(x["neighborhoods"])==18
          assert len({r["id"] for r in x["neighborhoods"]})==18
          assert len({r["name"] for r in x["neighborhoods"]})==18
          assert x["coverage"]["activeTotal"]==cnpj["kpis"]["active"]
          assert x["coverage"]["declaredPublished"]==sum(r["count"] for r in cnpj["byDistrictDeclared"])
          assert x["coverage"]["matched"]+x["coverage"]["unmatchedPublished"]==x["coverage"]["declaredPublished"]
          assert x["coverage"]["activeTotal"]>=x["coverage"]["declaredPublished"]
          assert y["snapshots"][-1]["reference"]==x["reference"]
          p=base/"bairros-economia.pmtiles"
          assert p.read_bytes()[:8]==b"PMTiles\x03"
          assert p.stat().st_size==x["pmtiles"]["bytes"]
          assert hashlib.sha256(p.read_bytes()).hexdigest()==x["pmtiles"]["sha256"]
          assert sum(r["population2022"] or 0 for r in x["neighborhoods"])==x["population2022LayerSum"]
          assert all((r["densityKm2"] is None or r["active"]>0 and r["areaKm2"]>0) for r in x["neighborhoods"])
          print("BAIRROS_PM_VALIDATED",len(x["neighborhoods"]),x["coverage"],"PMTiles bytes",p.stat().st_size,flush=True)
          PY
      - name: Guardar saídas auditadas de PMTiles e metadados
        uses: actions/upload-artifact@v4
        with:
          name: bairros-canoas-pmtiles-geocanoas-verificados
          path: |
            public/data/cnefe-hex500.pmtiles
            public/data/cnefe-hex500.json
            public/data/bairros-economia.pmtiles
            public/data/bairros-oficiais.geojson
            public/data/bairros-economia.json
            public/data/bairros-economia-series.json
          retention-days: 30
          if-no-files-found: error
      - name: Publicar dados oficiais sobre último commit de main
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/canoas-geo-approved
          cp public/data/cnefe-hex500.pmtiles public/data/cnefe-hex500.json public/data/bairros-economia.pmtiles public/data/bairros-economia.json public/data/bairros-economia-series.json public/data/bairros-oficiais.geojson /tmp/canoas-geo-approved/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/canoas-geo-approved/* public/data/
            git add public/data/cnefe-hex500.pmtiles public/data/cnefe-hex500.json public/data/bairros-economia.pmtiles public/data/bairros-economia.json public/data/bairros-economia-series.json public/data/bairros-oficiais.geojson
            if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
            git commit -m "data(geo): malha BAIRROSOFICIAL e agregados CNPJ PMTiles $(python -c 'import json; print(json.load(open("public/data/cnpj.json"))["reference"])')"
            if git push origin HEAD:main; then echo "BAIRROS_PM_COMMITTED"; exit 0; fi
            if [ "$i" -eq 5 ]; then exit 1; fi
          done
      - name: Publicar PMTiles de bairros e CNPJ no GitHub Pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
