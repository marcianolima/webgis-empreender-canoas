name: Probe official CNPJ distribution
on:
  push:
    paths: [.github/workflows/probe-cnpj.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe WebDAV archive metadata and fragments (no huge downloads)
        run: |
          python - <<'PY'
          import urllib.request, urllib.error,base64,xml.etree.ElementTree as ET
          root="https://arquivos.receitafederal.gov.br/public.php/dav/files/YggdBLfdninEJX9/"
          auth="Basic "+base64.b64encode(b"YggdBLfdninEJX9:").decode()
          for path in ["","2026-09/","2026-10/"]:
            try:
              req=urllib.request.Request(root+path,data=b'<d:propfind xmlns:d="DAV:"><d:allprop/></d:propfind>',method="PROPFIND",headers={"Authorization":auth,"Depth":"1"})
              with urllib.request.urlopen(req,timeout=15) as response:
                b=response.read(500000);tree=ET.fromstring(b)
                hrefs=[x.text for x in tree.findall(".//{DAV:}href")]
                print("DIRECTORY",path,response.status,"ENTRIES",len(hrefs),"SAMPLE",hrefs[:50],flush=True)
            except Exception as e:print("DIRECTORY FAIL",path,repr(e),flush=True)
          for name in ["Estabelecimentos0.zip","Estabelecimentos9.zip","Empresas0.zip","Empresas9.zip","Simples.zip","Cnaes.zip"]:
            url=root+"2026-09/"+name
            try:
              req=urllib.request.Request(url,method="HEAD",headers={"Authorization":auth})
              with urllib.request.urlopen(req,timeout=15) as response:
                print("FILE",name,response.status,response.headers.get("Content-Length"),response.headers.get("Content-Type"),flush=True)
            except Exception as e:print("FILE FAIL",name,repr(e),flush=True)
          PY
