name: Canoas Empreende | Dados oficiais e GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "27 10 * * 1"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: canoas-empreende-pages-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar coletores Python e validar sintaxe geoespacial
        run: |
          python -m compileall -q scripts/cnpj_pipeline.py scripts/cnpj_geo.py scripts/collect_hex500.py scripts/collect_bairros.py
          python -m unittest discover -s tests -v
      - name: Atualizar dados oficiais; preservar snapshot anterior se falhar
        timeout-minutes: 6
        run: |
          cp public/data/official.json /tmp/official-verified.json
          cp public/data/canoas.geojson /tmp/canoas-verified.geojson
          if timeout 240s python scripts/collect_official.py && python -c 'import json; from pathlib import Path; d=json.loads(Path("public/data/official.json").read_text()); assert d["municipality"]["code"]=="4304606"; assert len(d["cempre"])>0 and len(d["gdp"])>0 and len(d["population"])>0; assert Path("public/data/canoas.geojson").exists(); assert all(r["territory"]=="43" for r in d["rsBusiness"])'; then
            echo "Nova coleta oficial validada e selecionada para publicação"
          else
            echo "Fonte indisponível ou validação falhou; preservando snapshot real verificado"
            cp /tmp/official-verified.json public/data/official.json
            cp /tmp/canoas-verified.geojson public/data/canoas.geojson
          fi
      - name: Atualizar série municipal Firjan IFDM e IFGF (com snapshots verificados)
        timeout-minutes: 3
        run: |
          cp public/data/ifdm-firjan.json /tmp/ifdm-firjan-verified.json
          cp public/data/ifgf-firjan.json /tmp/ifgf-firjan-verified.json
          if timeout 70s python scripts/collect_firjan.py; then
            echo "IFDM municipal revisado 2013–2023 validado"
          else
            echo "::warning::Firjan IFDM indisponível: preservado último histórico oficial verificado"
            cp /tmp/ifdm-firjan-verified.json public/data/ifdm-firjan.json
          fi
          if timeout 70s python scripts/collect_ifgf.py; then
            echo "IFGF municipal 2013–2024 validado"
          else
            echo "::warning::Firjan IFGF indisponível: preservado último histórico oficial verificado"
            cp /tmp/ifgf-firjan-verified.json public/data/ifgf-firjan.json
          fi
          python -m unittest discover -s tests -p 'test_firjan.py' -v
      - name: Coletar indicadores setoriais IBGE (PAM, PPM, PEVS, VAB)
        timeout-minutes: 3
        run: |
          if timeout 140s python scripts/collect_sectors.py; then
            echo "Indicadores setoriais municipais obtidos de fontes oficiais"
          else
            echo "Fonte indisponível; mantendo snapshot real ou situação sem dados"
          fi
      - name: Coletar exportações e emprego formal DEE/DataRS (Canoas)
        timeout-minutes: 2
        run: |
          if timeout 95s python scripts/collect_dee.py; then
            echo "DEE/DataRS municipal verificado"
          else
            echo "DataRS indisponível; preservando última fotografia real ou estado sem dados"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar código
        run: |
          npm run lint
          npm run typecheck
      - name: Exportar Next.js estático
        run: npm run build
      - name: Validar site e integridade territorial
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p=Path("out")
          for name in ("index.html","sobre/index.html","fontes/index.html","atualizacao/index.html","sebrae/index.html"):
              assert (p/name).exists(), name+" não foi gerado"
          html=(p/"index.html").read_text()
          assert "/webgis-empreender-canoas/_next/" in html, "Next.js sem basePath Pages"
          d=json.loads((p/"data/official.json").read_text())
          assert d["municipality"]["code"]=="4304606"
          assert d["quality"]["status"] in ("ok","partial")
          assert d["cempre"] or d["gdp"] or d["population"]
          if d.get("cempreCurrent"):
              assert min(x["year"] for x in d["cempreCurrent"])>=2022
              assert max(x["year"] for x in d["cempre"])<=2021
          assert all(r["territory"]=="43" for r in d["rsBusiness"]), "JUCISRS estadual classificado como municipal"
          assert all(r["value"]>=0 for r in d["rsBusiness"])
          assert (p/"data/canoas.geojson").exists(), "malha IBGE ausente"
          cnpj=json.loads((p/"data/cnpj.json").read_text())
          assert cnpj["municipalityIbgeCode"]=="4304606"
          assert cnpj["status"] in ("not_loaded","official")
          ifdm=json.loads((p/"data/ifdm-firjan.json").read_text())
          ifgf=json.loads((p/"data/ifgf-firjan.json").read_text())
          assert ifdm["territory"]==ifgf["territory"]=="4304606"
          assert ifdm["status"]==ifgf["status"]=="verified"
          assert [x["year"] for x in ifdm["series"]]==list(range(2013,2024))
          assert [x["year"] for x in ifgf["series"]]==list(range(2013,2025))
          assert ifdm["referenceYear"]==2023 and ifgf["referenceYear"]==2024
          assert "0.7239" in str(ifdm["series"][-1]["values"]["general"])
          assert "0.6639" in str(ifgf["series"][-1]["values"]["general"])
          sectors=json.loads((p/"data/sectors.json").read_text())
          assert sectors["territory"]=="4304606"
          assert all(r["territory"]=="4304606" for r in sectors["observations"])
          dee=json.loads((p/"data/dee.json").read_text())
          assert dee["territory"]=="4304606"
          seb=json.loads((p/"data/sebrae.json").read_text())
          assert seb["municipalityIbgeCode"]=="4304606"
          assert seb["status"] in ("not_loaded","verified")
          if seb["status"]=="verified":
              assert len(seb["metrics"])>=15 and len(seb["archived"]["observations"])>=45
          assert all(r["territory"]=="4304606" for r in dee["observations"])
          series=json.loads((p/"data/sebrae-series.json").read_text())
          assert series["municipalityIbgeCode"]=="4304606"
          assert series["status"] in ("ok","partial","not_loaded")
          if series["status"]!="not_loaded":
              assert series["coverage"]["available"]>=50
              assert series["coverage"]["catalogCubes"]>=80
              assert series["coverage"]["rows"]>=4000
              ra=next(x for x in series["datasets"] if x["id"]=="rais-trabalho-anual")
              assert next(row["Workers"] for row in ra["rows"] if row["Year"]==2025)==95355
          assert (p/"sebrae/series/index.html").exists(),"página das séries não exportada"
          assert (p/"sebrae/consulta/index.html").exists(),"página de consulta avançada não exportada"
          assert (p/"bairros/index.html").exists(),"página de bairros não exportada"
          assert (p/"hex500/index.html").exists(),"página hexagonal não exportada"
          assert (p/"territorio/index.html").exists(),"cartografia comparativa não exportada"
          assert (p/"censo2022/index.html").exists(),"atlas censitário não exportado"
          sectors=json.loads((p/"data/censo2022-setores.json").read_text())
          seams=json.loads((p/"data/censo2022-setores-bairros.json").read_text())
          features=json.loads((p/"data/censo2022-setores.geojson").read_text())
          tiles=p/"data/censo2022-setores.pmtiles"
          assert sectors["schemaVersion"]==1 and sectors["status"]=="verified"
          assert sectors["territory"]==seams["territory"]=="4304606"
          assert sectors["sectorCount"]==len(sectors["sectors"])==len(features["features"])==659
          assert sectors["populationSumReported"]==347657
          assert len(seams["neighborhoods"])==18
          assert len(sectors["dictionary"])>=100
          assert tiles.exists() and tiles.read_bytes()[:8]==bytes((80,77,84,105,108,101,115,3))
          assert hashlib.sha256(tiles.read_bytes()).hexdigest()==sectors["pmtiles"]["sha256"]
          assert sectors["privacy"]["individualCoordinatesPublished"] is False
          assert (p/"data/bairros-oficiais.geojson").exists(),"malha GeoCanoas não armazenada"
          bounds=json.loads((p/"data/bairros-oficiais.geojson").read_text())
          assert len(bounds["features"])==18
          hexinfo=json.loads((p/"data/cnefe-hex500.json").read_text())
          assert hexinfo["territory"]=="4304606"
          assert hexinfo["status"] in ("verified","not_loaded")
          if hexinfo.get("cnpjMatch"):
              assert hexinfo["cnpjReference"]==cnpj["reference"]
              assert hexinfo["cnpjMatch"]["matched"]<=hexinfo["cnpjMatch"]["active"]
              assert hexinfo["cnpjMatch"]["active"]==cnpj["kpis"]["active"]
              assert hexinfo["privacy"]["individualCoordinatesPublished"] is False
          if hexinfo["status"]=="verified":
              hextiles=p/"data/cnefe-hex500.pmtiles"
              assert hextiles.exists() and hextiles.read_bytes()[:8]==bytes((80,77,84,105,108,101,115,3))
              assert hexinfo["cellWidthMeters"]==500
              assert hexinfo["coverage"]["gridCells"]>=300
              assert hexinfo["privacy"]["individualCoordinatesPublished"] is False
          mapmeta=json.loads((p/"data/bairros-economia.json").read_text())
          assert mapmeta["territory"]=="4304606"
          assert mapmeta["status"] in ("not_loaded","verified")
          if mapmeta["status"]=="verified":
              tile=p/"data/bairros-economia.pmtiles"
              assert tile.exists() and tile.read_bytes()[:8]==b"PMTiles\\x03".decode("unicode_escape").encode("latin1")
              assert len(mapmeta["neighborhoods"])==18
              assert mapmeta["coverage"]["activeTotal"]==cnpj["kpis"]["active"]
              assert mapmeta["coverage"]["matched"]<=mapmeta["coverage"]["activeTotal"]
          print("Dados:",len(d["cempre"]),"CEMPRE,",len(d["gdp"]),"PIB,",len(d["cnae"]),"CNAE,",len(d["rsBusiness"]),"meses RS")
          PY
          touch out/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
      - name: Validar o site HTTP
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          base=os.environ["PAGE_URL"].rstrip("/")+"/"
          if not base.startswith("https://"):
              raise ValueError("URL não é HTTPS")
          for attempt in range(12):
              try:
                  def get(path):
                      with urllib.request.urlopen(base+path,timeout=15) as response:
                          assert response.status==200
                          return response.read()
                  page=get("").decode()
                  assert "Canoas Empreende" in page
                  d=json.loads(get("data/official.json"))
                  assert d["municipality"]["code"]=="4304606"
                  a=json.loads(get("data/ifdm-firjan.json"))
                  b=json.loads(get("data/ifgf-firjan.json"))
                  assert a["territory"]==b["territory"]=="4304606"
                  assert len(a["series"])==11 and len(b["series"])==12
                  assert a["referenceYear"]==2023 and b["referenceYear"]==2024
                  get("data/canoas.geojson")
                  get("sobre/")
                  get("sebrae/series/")
                  get("sebrae/consulta/")
                  get("bairros/")
                  get("hex500/")
                  get("territorio/")
                  get("censo2022/")
                  census=json.loads(get("data/censo2022-setores.json"))
                  assert census["territory"]=="4304606" and census["sectorCount"]==659
                  assert census["populationSumReported"]==347657
                  assert len(json.loads(get("data/censo2022-setores-bairros.json"))["neighborhoods"])==18
                  pm_set=get("data/censo2022-setores.pmtiles")
                  assert pm_set[:8]==bytes((80,77,84,105,108,101,115,3))
                  print("CENSO_SETORES_PM_HTTP_OK",len(pm_set),flush=True)
                  detail=json.loads(get("data/cnefe-hex500.json"))
                  assert detail["territory"]=="4304606"
                  if detail.get("status")=="verified":
                      pmh=get("data/cnefe-hex500.pmtiles")
                      assert pmh[:8]==bytes((80,77,84,105,108,101,115,3))
                      print("CNEFE_HEX_PM_HTTP_OK",len(pmh),flush=True)
                  official_geo=json.loads(get("data/bairros-oficiais.geojson"))
                  assert len(official_geo["features"])==18
                  try:
                      b=json.loads(get("data/bairros-economia.json"))
                      if b.get("status")=="verified":
                          pm=get("data/bairros-economia.pmtiles")
                          assert pm[:8]==bytes((80,77,84,105,108,101,115,3))
                          assert len(b["neighborhoods"])==18
                          print("BAIRROS_PM_TILES_HTTP_OK",len(pm),flush=True)
                  except Exception as err:
                      raise AssertionError("Falha na publicação cartográfica: "+str(err))
                  query=json.loads(get("data/sebrae-series.json"))
                  assert query["municipalityIbgeCode"]=="4304606"
                  print("Sebrae séries municipais:",query["coverage"],flush=True)
                  print("GitHub Pages validado:",base,d["quality"]["status"])
                  break
              except Exception as exc:
                  if attempt==11:raise
                  print("Tentativa",attempt+1,str(exc),flush=True)
                  time.sleep(5)
          PY
