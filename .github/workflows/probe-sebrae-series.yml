name: Research public Sebrae OLAP metadata
on:
  push:
    paths: [.github/workflows/probe-sebrae-series.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verificar documentação API, status, dados públicos e esquema de componentes
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,urllib.error,json,re,html,time
          U="https://observatorio.sebrae.com.br/profile/geo/canoas"
          req=urllib.request.Request(U,headers={"User-Agent":"Mozilla/5.0 CanoasEmpreende-Research/1.0","Accept-Encoding":"identity"})
          with urllib.request.urlopen(req,timeout=35) as r:
            content=r.read(2200000).decode("utf-8")
          p=json.loads(re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',content,re.S).group(1))["props"]["pageProps"]
          root=p["initialState"]["records"]
          print("PAGE",p["profileProps"]["id"],"entities",[(k,len(v)) for k,v in root["entities"].items()],flush=True)
          for k,v in list(root["entities"]["datasource"].items())[:6]:
            c=v.get("content",{})
            print("DATASOURCE",k,"TYPE",type(c).__name__,"CONTENT",str(c)[:500],flush=True)
          for k,v in list(root["entities"]["block"].items())[:15]:
            c=v.get("content",{})
            print("BLOCK",k,"type",v.get("type"),"name",v.get("name"),"chart",str(c)[:450],flush=True)
          urls=[
          "https://apiv2-observatorio.sebrae.com.br/tesseract/cubes",
          "https://apiv2-observatorio.sebrae.com.br/tesseract/cubes/RAIS_workers",
          "https://api-observatorio.sebrae.com.br/cubes",
          "https://api-observatorio.sebrae.com.br/cubes/RAIS_workers",
          "https://api-observatorio.sebrae.com.br/data.jsonrecords?cube=RAIS_workers&drilldowns=Year&measures=Workers&Municipality=4304606&Year=2025",
          "https://apiv2-observatorio.sebrae.com.br/tesseract/data.jsonrecords?cube=RAIS_workers&drilldowns=Year&measures=Workers&Municipality=4304606&Year=2025",
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 CanoasEmpreende-Research/1.0","Accept":"application/json","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=14) as r:
                b=r.read(9000)
                print("HTTP",r.status,"URL",url,"TYPE",r.headers.get("Content-Type"),"BYTES",len(b),"CONTENT",repr(b[:1200]),flush=True)
            except Exception as e:print("ERROR",url,type(e).__name__,str(e)[:350],flush=True)
          PY
