name: Diagnosticar consultas IBGE
on:
  push:
    paths:
      - .github/workflows/inspect-sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir formatos da API SIDRA
        run: |
          python - <<'PY'
          import urllib.request, json
          urls=[
            "https://servicodados.ibge.gov.br/api/v3/agregados/993/metadados",
            "https://servicodados.ibge.gov.br/api/v3/agregados/993/periodos/2021/variaveis/2585?localidades=N6%5B4304606%5D",
            "https://servicodados.ibge.gov.br/api/v3/agregados/993/periodos/2016-2021/variaveis/2585?localidades=N6%5B4304606%5D",
            "https://servicodados.ibge.gov.br/api/v3/agregados/993/periodos/2016%7C2017%7C2018%7C2019%7C2020%7C2021/variaveis/2585?localidades=N6%5B4304606%5D",
            "https://servicodados.ibge.gov.br/api/v3/agregados/993/periodos/2021/variaveis/2585?localidades=N6%5B4304606%5D&classificacao=12762%5Ball%5D%7C319%5B0%5D%7C12386%5B0%5D",
            "https://servicodados.ibge.gov.br/api/v3/agregados/5938/periodos/2018-2023/variaveis/37?localidades=N6%5B4304606%5D",
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (CanoasEmpreende/0.2)","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=16) as resp:
                raw=resp.read(4000)
                print("PROBE",resp.status,url,"bytes",len(raw),"preview",repr(raw[:450]),flush=True)
            except Exception as ex:
              print("PROBE ERROR",url,repr(ex),flush=True)
          PY
